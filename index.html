<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insanity Games | Plataforma de Campeonatos</title><style>:root{font-family:Inter,Arial,sans-serif;color:#e9f1ff;background:#07101d}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;background:#0c1b2c;border-bottom:1px solid #263a51}h1{margin:0;color:#3aa6ff;letter-spacing:2px}small,.muted{color:#9cb0c8}nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}button{background:#1685e6;color:white;border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:700}button.alt{background:#1c3047}button.active{background:#fff;color:#081525}main{max-width:1150px;margin:30px auto;padding:0 18px}.panel{background:#102035;border:1px solid #29425e;border-radius:14px;padding:22px;margin:16px 0}h2{margin-top:0}input,select,textarea{width:100%;padding:11px;border-radius:7px;background:#071525;color:white;border:1px solid #36516e;margin:6px 0 13px}label{font-size:13px;color:#c4d7ed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}td,th{border-bottom:1px solid #2a405a;text-align:left;padding:12px}th{color:#74c0ff}.tag{display:inline-block;border-radius:5px;padding:5px 8px;background:#183f60}.hidden{display:none}.notice{padding:12px;background:#20374b;border-radius:8px;margin:12px 0}footer{text-align:center;padding:35px;color:#8199b5}</style></head><body><header><h1>INSANITY GAMES</h1><div class="muted">Competições • Inscrições • Baterias • Leaderboard</div><nav id="nav"></nav></header><main id="main"></main><footer>Versão SaaS demonstrativa • Academias e eventos separados neste navegador • Pagamentos não ativados</footer><script>
const KEY='insanity-games-saas-demo-v2';const TENANTS_KEY='insanity-games-tenants-v1';
let tenants=JSON.parse(localStorage.getItem(TENANTS_KEY)||'null')||[{id:'insanity',name:'Insanity Lifestyle Fitness',events:[{id:'games',name:'Insanity Games — Edição Demo'}]}];
let currentOrg=localStorage.getItem('insanity-current-org')||'insanity';let currentEvent=localStorage.getItem('insanity-current-event')||'games';
function storeTenants(){localStorage.setItem(TENANTS_KEY,JSON.stringify(tenants))}
function storageKey(){return KEY+'-'+currentOrg+'-'+currentEvent}
function switchOrg(v){currentOrg=v;currentEvent=tenants.find(o=>o.id===v).events[0]?.id||'';localStorage.setItem('insanity-current-org',currentOrg);localStorage.setItem('insanity-current-event',currentEvent);loadEvent();tab='leaderboard';render()}
function switchEvent(v){currentEvent=v;localStorage.setItem('insanity-current-event',v);loadEvent();tab='leaderboard';render()}
function loadEvent(){let ev=tenants.find(o=>o.id===currentOrg)?.events.find(e=>e.id===currentEvent);db=JSON.parse(localStorage.getItem(storageKey())||'null')||structuredClone(initial);db.event=ev?.name||db.event;save()}
function createOrg(e){e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;let oid='org-'+Date.now();tenants.push({id:oid,name,events:[]});storeTenants();currentOrg=oid;currentEvent='';localStorage.setItem('insanity-current-org',oid);localStorage.setItem('insanity-current-event','');tab='platform';render()}
function createEvent(e){e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;let org=tenants.find(o=>o.id===currentOrg);let eid='event-'+Date.now();org.events.push({id:eid,name});storeTenants();currentEvent=eid;localStorage.setItem('insanity-current-event',eid);db=structuredClone(initial);db.event=name;save();tab='admin';render()}
let initial={event:'Insanity Games — Edição Demo',categories:['RX Masculino','RX Feminino','Scaled Masculino','Scaled Feminino'],athletes:[{id:1,name:'Atleta A',category:'RX Masculino',team:'Insanity',paid:true},{id:2,name:'Atleta B',category:'RX Masculino',team:'Insanity',paid:true},{id:3,name:'Atleta C',category:'RX Masculino',team:'Convidado',paid:true}],wods:[{id:1,name:'WOD 1 — Sprint',type:'time',description:'For time: 21-15-9 thrusters e burpees',cap:'12 min'},{id:2,name:'WOD 2 — Max Reps',type:'reps',description:'AMRAP 10 min',cap:'10 min'},{id:3,name:'WOD 3 — Max Load',type:'load',description:'Maior carga válida',cap:'8 min'}],scores:[{athleteId:1,wodId:1,value:310,published:true},{athleteId:2,wodId:1,value:325,published:true},{athleteId:3,wodId:1,value:340,published:true},{athleteId:1,wodId:2,value:150,published:true},{athleteId:2,wodId:2,value:160,published:true},{athleteId:3,wodId:2,value:145,published:true}],heats:[{id:1,wodId:1,category:'RX Masculino',time:'08:00',lane:1,athleteId:1},{id:2,wodId:1,category:'RX Masculino',time:'08:00',lane:2,athleteId:2},{id:3,wodId:1,category:'RX Masculino',time:'08:00',lane:3,athleteId:3}],points:[100,95,90,85,80,75,70,65,60,55,50]};let db=JSON.parse(localStorage.getItem(storageKey())||'null')||structuredClone(initial);let tab='leaderboard';let cat='Todas';const save=()=>localStorage.setItem(storageKey(),JSON.stringify(db));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now()+Math.floor(Math.random()*1000);const wod=i=>db.wods.find(w=>w.id==i);const athlete=i=>db.athletes.find(a=>a.id==i);const score=(a,w)=>db.scores.find(s=>s.athleteId==a&&s.wodId==w&&s.published);const fmt=(v,t)=>t==='time'?`${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`:String(v);function rankings(category){let as=db.athletes.filter(a=>a.paid&&(category==='Todas'||a.category===category));let records=as.map(a=>{let details={};let total=0;for(let w of db.wods){let ranked=as.filter(x=>x.category===a.category&&score(x.id,w.id)).sort((x,y)=>w.type==='time'?score(x.id,w.id).value-score(y.id,w.id).value:score(y.id,w.id).value-score(x.id,w.id).value);let pos=ranked.findIndex(x=>x.id===a.id);if(pos>=0){let val=score(a.id,w.id).value;let rank=ranked.filter(x=>w.type==='time'?score(x.id,w.id).value<val:score(x.id,w.id).value>val).length+1;let pts=db.points[rank-1]??Math.max(0,55-(rank-10)*5);details[w.id]={rank,pts,val};total+=pts}}return {a,details,total}});return records.sort((a,b)=>b.total-a.total||a.a.name.localeCompare(b.a.name))}function render(){document.getElementById('nav').innerHTML=[['platform','Academias e eventos'],['billing','Planos e cobrança'],['leaderboard','Leaderboard'],['wods','WODs'],['heats','Baterias'],['register','Inscrições'],['admin','Administração']].map(([k,v])=>`<button class="${tab===k?'active':'alt'}" onclick="tab='${k}';render()">${v}</button>`).join('');let m=document.getElementById('main');let org=tenants.find(o=>o.id===currentOrg)||tenants[0];document.querySelector('header .muted').innerHTML='Plataforma multiacademias • <strong>'+esc(org.name)+'</strong> • '+esc(db.event||'Nenhum evento selecionado');
if(tab==='billing'){let n=db.athletes.filter(a=>a.paid).length;let fee=n<=15?0:n<=30?(n-15)*3:99.90;let plan=n<=10?'START':n<=15?'TRANSIÇÃO':n<=30?'PRO':'PREMIUM';m.innerHTML=`<div class="panel"><h2>💳 Planos e cobrança da plataforma</h2><p class="notice">Simulação comercial — nenhum pagamento é processado. Valores comerciais aprovados: R$ 3,00 por inscrição adicional e R$ 99,90/mês. Nenhuma cobrança real é realizada.</p><div class="grid"><div class="panel"><small>Inscrições confirmadas (indivíduo, dupla ou equipe = 1 inscrição)</small><h2>${n}</h2></div><div class="panel"><small>Faixa atual</small><h2>${plan}</h2></div><div class="panel"><small>Cobrança estimada</small><h2>R$ ${fee.toFixed(2).replace('.',',')}</h2></div></div><label>Simular quantidade de inscrições confirmadas</label><input id="billingCount" type="number" min="0" value="${n}" oninput="simulateBilling(this.value)"><div id="billingResult"></div><p><strong>0–10:</strong> gratuito · <strong>11–15:</strong> gratuito (transição) · <strong>16–30:</strong> R$ 3 por inscrição acima da 15ª · <strong>31+:</strong> R$ 99,90/mês substitui a taxa variável.</p><p class="muted">A contagem é por campeonato, e a cobrança de mensalidade depende de contrato/assinatura ativa. A regra final deverá definir cancelamentos, reembolsos, períodos e quando a mensalidade começa.</p></div>`;simulateBilling(n);return}if(tab==='platform'){m.innerHTML=`<div class="panel"><h2>🏢 Academias e organizadores</h2><p class="notice">Demonstração local: cada academia e campeonato tem seus próprios dados. Autenticação e isolamento no servidor serão ativados na versão online.</p><label>Selecionar academia</label><select onchange="switchOrg(this.value)">${tenants.map(o=>`<option value="${esc(o.id)}" ${o.id===currentOrg?'selected':''}>${esc(o.name)}</option>`).join('')}</select><form onsubmit="createOrg(event)"><label>Cadastrar nova academia</label><input name="name" required maxlength="100" placeholder="Nome da academia"><button>Criar academia de teste</button></form></div><div class="panel"><h2>🏆 Campeonatos de ${esc(org.name)}</h2><label>Selecionar campeonato</label><select onchange="switchEvent(this.value)">${org.events.map(e=>`<option value="${esc(e.id)}" ${e.id===currentEvent?'selected':''}>${esc(e.name)}</option>`).join('')}</select><form onsubmit="createEvent(event)"><label>Novo campeonato</label><input name="name" required maxlength="120" placeholder="Ex.: Copa Regional 2027"><button>Criar campeonato de teste</button></form><p class="muted">${org.events.length} campeonato(s) cadastrado(s) nesta academia.</p></div>`;return}
if(!currentEvent){m.innerHTML='<div class="panel"><h2>Crie um campeonato</h2><p>Abra a aba Academias e eventos para cadastrar o primeiro campeonato desta academia.</p></div>';return}
if(tab==='leaderboard'){let rs=rankings(cat);m.innerHTML=`<div class="panel"><h2>🏆 ${esc(db.event)} — Leaderboard</h2><label>Categoria</label><select onchange="cat=this.value;render()">${['Todas',...db.categories].map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="scroll"><table><thead><tr><th>Posição na lista</th><th>Atleta / Equipe</th>${db.wods.map(w=>`<th>${esc(w.name)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td><strong>${i+1}º</strong></td><td>${esc(r.a.name)}<br><small>${esc(r.a.team)} • ${esc(r.a.category)}</small></td>${db.wods.map(w=>{let d=r.details[w.id];return `<td>${d?`${fmt(d.val,w.type)}<br><small>${d.rank}º • ${d.pts} pts</small>`:'—'}</td>`}).join('')}<td><strong>${r.total}</strong></td></tr>`).join('')}</tbody></table></div><p class="muted">Pontuação de cada WOD calculada dentro da categoria do atleta. Em “Todas”, a lista reúne categorias diferentes e não representa classificação geral única. Resultados de demonstração.</p></div>`}else if(tab==='wods'){m.innerHTML=`<h2>Treinos e provas</h2><div class="grid">${db.wods.map(w=>`<section class="panel"><h2>${esc(w.name)}</h2><span class="tag">${esc(w.type)}</span><p>${esc(w.description)}</p><small>Time cap: ${esc(w.cap)}</small></section>`).join('')}</div>`}else if(tab==='heats'){m.innerHTML=`<div class="panel"><h2>Ordem de baterias e raias</h2><div class="scroll"><table><tr><th>WOD</th><th>Categoria</th><th>Horário</th><th>Raia</th><th>Atleta</th></tr>${db.heats.sort((a,b)=>a.time.localeCompare(b.time)||a.lane-b.lane).map(h=>`<tr><td>${esc(wod(h.wodId)?.name)}</td><td>${esc(h.category)}</td><td>${esc(h.time)}</td><td>${h.lane}</td><td>${esc(athlete(h.athleteId)?.name)}</td></tr>`).join('')}</table></div></div>`}else if(tab==='register'){m.innerHTML=`<div class="panel"><h2>Inscrição de atleta</h2><p class="notice">Modo demonstração: este formulário NÃO cobra nem confirma pagamento. A inscrição fica pendente até validação manual no painel.</p><form onsubmit="register(event)"><label>Nome completo</label><input name="name" required maxlength="100"><label>Equipe / Box</label><input name="team" required maxlength="100"><label>Categoria</label><select name="category">${db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><label>E-mail</label><input name="email" type="email" required><button>Enviar inscrição de teste</button></form></div>`}else{m.innerHTML=`<div class="panel"><h2>Painel administrativo — demonstração</h2><p class="notice">Sem autenticação neste protótipo. Não utilize dados reais ou financeiros. A versão publicada exigirá login seguro e permissões.</p><div class="grid"><div><h3>Publicar resultado</h3><form onsubmit="addScore(event)"><label>Atleta</label><select name="athleteId">${db.athletes.filter(a=>a.paid).map(a=>`<option value="${a.id}">${esc(a.name)} (${esc(a.category)})</option>`).join('')}</select><label>WOD</label><select name="wodId">${db.wods.map(w=>`<option value="${w.id}">${esc(w.name)} (${w.type})</option>`).join('')}</select><label>Resultado numérico (tempo em segundos)</label><input name="value" type="number" min="0" step="1" required><button>Salvar e publicar</button></form></div><div><h3>Adicionar WOD</h3><form onsubmit="addWod(event)"><label>Nome</label><input name="name" required><label>Tipo</label><select name="type"><option value="time">Menor tempo</option><option value="reps">Mais repetições</option><option value="load">Maior carga</option><option value="distance">Maior distância</option></select><label>Descrição</label><textarea name="description"></textarea><label>Time cap</label><input name="cap"><button>Adicionar WOD</button></form></div><div><h3>Adicionar bateria</h3><form onsubmit="addHeat(event)"><label>WOD</label><select name="wodId">${db.wods.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select><label>Atleta</label><select name="athleteId">${db.athletes.filter(a=>a.paid).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><label>Horário</label><input type="time" name="time" required><label>Raia</label><input type="number" name="lane" min="1" required><button>Adicionar à bateria</button></form></div><div><h3>Inscrições pendentes</h3>${db.athletes.filter(a=>!a.paid).map(a=>`<p>${esc(a.name)} — ${esc(a.category)} <button onclick="approve(${a.id})">Confirmar manualmente</button></p>`).join('')||'<p>Nenhuma pendente.</p>'}<h3>Dados da demonstração</h3><button class="alt" onclick="if(confirm('Apagar os dados locais e restaurar demonstração?')){db=structuredClone(initial);save();render()}">Restaurar dados de exemplo</button></div></div></div>`}}function simulateBilling(value){let n=Math.max(0,Math.floor(Number(value)||0));let plan=n<=10?'START':n<=15?'TRANSIÇÃO':n<=30?'PRO':'PREMIUM';let fee=n<=15?0:n<=30?(n-15)*3:99.9;document.getElementById('billingResult').innerHTML='<p class="notice">'+n+' inscrições → '+plan+' → <strong>R$ '+fee.toFixed(2).replace('.',',')+'</strong>'+(n>30?' por mês':' no campeonato')+'</p>'}function register(e){e.preventDefault();let d=new FormData(e.target);db.athletes.push({id:id(),name:d.get('name'),team:d.get('team'),category:d.get('category'),email:d.get('email'),paid:false});save();alert('Inscrição de teste recebida. Pagamento não processado.');render()}function approve(i){athlete(i).paid=true;save();render()}function addScore(e){e.preventDefault();let d=new FormData(e.target),a=+d.get('athleteId'),w=+d.get('wodId'),v=+d.get('value');db.scores=db.scores.filter(s=>!(s.athleteId===a&&s.wodId===w));db.scores.push({athleteId:a,wodId:w,value:v,published:true});save();alert('Resultado publicado no leaderboard.');render()}function addWod(e){e.preventDefault();let d=new FormData(e.target);db.wods.push({id:id(),name:d.get('name'),type:d.get('type'),description:d.get('description'),cap:d.get('cap')});save();render()}function addHeat(e){e.preventDefault();let d=new FormData(e.target),a=athlete(+d.get('athleteId'));db.heats.push({id:id(),wodId:+d.get('wodId'),athleteId:a.id,category:a.category,time:d.get('time'),lane:+d.get('lane')});save();render()}loadEvent();render();</script></body></html>
